apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://172.18.0.2:6443
  name: my-kind
contexts:
- context:
    cluster: my-kind
    user: system:node:my-kind-control-plane
  name: system:node:my-kind-control-plane@my-kind
current-context: system:node:my-kind-control-plane@my-kind
kind: Config
users:
- name: system:node:my-kind-control-plane
  user:
    client-certificate: /var/lib/kubelet/pki/kubelet-client-current.pem
    client-key: /var/lib/kubelet/pki/kubelet-client-current.pem
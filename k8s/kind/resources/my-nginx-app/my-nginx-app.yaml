apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-nginx-app
  template:
    metadata:
      labels:
        app: my-nginx-app
    spec:
      containers:
      - name: myapp
        image: nginx-with-ip:latest
        securityContext:
          capabilities: # grant network admin privileges to the container
            add:
            - NET_ADMIN
            - NET_RAW
        imagePullPolicy: Never  # Ensure the local image is used
        ports:
        - containerPort: 80
